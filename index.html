<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Prism - Pokémon Camera Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #12122c 0%, #05050f 100%);
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(244, 224, 165, 0.15);
        }
        .aurora-glow {
            box-shadow: 0 0 30px rgba(244, 224, 165, 0.1), inset 0 0 20px rgba(244, 224, 165, 0.05);
            transition: all 0.6s ease-in-out;
        }
        .shutter-btn {
            background: linear-gradient(135deg, #222222 0%, #0a0a0a 100%);
            border: 2px solid #f4e0a5;
            box-shadow: 0 0 20px rgba(244, 224, 165, 0.3);
            transition: all 0.2s ease;
        }
        .shutter-btn:active { transform: scale(0.9); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Interactive Asset Elements */
        .pokemon-overlay-img, .item-overlay-img {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        video {
            transition: filter 0.6s ease-in-out;
        }
        .brand-banner {
            text-shadow: 0 0 10px rgba(244, 224, 165, 0.4);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen text-slate-200 p-4 font-sans select-none">

    <header class="w-full max-w-md flex justify-between items-center z-10 pt-2">
        <div class="flex items-center gap-2">
            <div id="status-orb" class="w-2 h-2 rounded-full bg-[#f4e0a5] animate-pulse"></div>
            <span class="text-xs tracking-[0.4em] uppercase text-[#f4e0a5] font-light">Ethereal Snapshot</span>
        </div>
        <button id="flip-btn" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-[#f4e0a5] hover:scale-105 transition">
            <i data-lucide="camera-reverse" class="w-5 h-5"></i>
        </button>
    </header>

    <main class="relative w-full max-w-md aspect-[3/4] my-auto flex items-center justify-center">
        <div class="absolute inset-0 border border-[#f4e0a5]/20 rounded-3xl pointer-events-none p-2 z-20">
            <div class="w-full h-full border border-[#f4e0a5]/10 rounded-2xl relative">
                <div class="absolute top-2 left-2 w-3 h-3 border-t border-l border-[#f4e0a5]/40"></div>
                <div class="absolute top-2 right-2 w-3 h-3 border-t border-r border-[#f4e0a5]/40"></div>
                <div class="absolute bottom-2 left-2 w-3 h-3 border-b border-l border-[#f4e0a5]/40"></div>
                <div class="absolute bottom-2 right-2 w-3 h-3 border-b border-r border-[#f4e0a5]/40"></div>
            </div>
        </div>

        <div id="camera-container" class="w-[calc(100%-16px)] h-[calc(100%-16px)] rounded-2xl overflow-hidden aurora-glow relative bg-black/60">
            <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            
            <div class="absolute top-4 left-0 right-0 text-center pointer-events-none z-10">
                <span class="brand-banner text-[13px] tracking-[0.25em] font-medium text-[#f4e0a5] uppercase px-4 py-1.5 rounded-full bg-black/20 backdrop-blur-sm border border-[#f4e0a5]/10">
                    ❤️ Arra heart Mark ❤️
                </span>
            </div>

            <div class="absolute bottom-4 left-4 w-1/4 h-1/4 pointer-events-none z-10 flex items-end justify-start">
                <img id="item-overlay" src="" class="max-w-full max-h-full object-contain opacity-0 item-overlay-img" alt="Cute Item">
            </div>

            <div class="absolute bottom-4 right-4 w-1/3 h-1/3 pointer-events-none z-10 flex items-end justify-end">
                <img id="active-overlay" src="" class="max-w-full max-h-full object-contain opacity-0 pokemon-overlay-img" alt="Active Character Overlay">
            </div>

            <div id="error-state" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center hidden bg-slate-950/90">
                <i data-lucide="video-off" class="w-8 h-8 text-[#f4e0a5]/50 mb-2"></i>
                <p class="text-xs text-[#f4e0a5]/80 tracking-wide">Seeking connection with device camera hardware...</p>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-md flex flex-col gap-2 mb-2 z-10">
        <span class="text-[10px] tracking-widest text-[#f4e0a5]/60 uppercase pl-1">Decorations</span>
        <div id="item-selector" class="w-full flex gap-3 overflow-x-auto no-scrollbar pb-2 px-1"></div>

        <span class="text-[10px] tracking-widest text-[#f4e0a5]/60 uppercase pl-1">Characters</span>
        <div id="pokemon-selector" class="w-full flex gap-3 overflow-x-auto no-scrollbar pb-2 px-1"></div>

        <div class="w-full glass-panel rounded-3xl p-4 flex items-center justify-between mt-2">
            <button id="clear-frame-btn" class="w-12 h-12 rounded-full flex items-center justify-center text-rose-300/60 hover:text-rose-400 transition">
                <i data-lucide="ban" class="w-5 h-5"></i>
            </button>

            <button id="capture-btn" aria-label="Capture photo" class="shutter-btn w-16 h-16 rounded-full flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border border-[#f4e0a5]/20 flex items-center justify-center">
                    <div class="w-3 h-3 rounded-full bg-[#f4e0a5]"></div>
                </div>
            </button>

            <div class="w-12 h-12 rounded-full flex items-center justify-center text-[#f4e0a5]/40">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
        </div>

        <div class="w-full glass-panel rounded-3xl p-4 mt-4">
            <div class="flex items-center justify-between mb-3 gap-2">
                <div>
                    <p class="text-xs uppercase tracking-[0.25em] text-[#f4e0a5]/70">Saved Gallery</p>
                    <span id="gallery-count" class="text-[10px] text-[#f4e0a5]/60">0 photos</span>
                </div>
                <button id="clear-gallery-btn" class="py-2 px-3 rounded-full border border-[#f4e0a5]/30 text-[10px] uppercase tracking-[0.25em] text-[#f4e0a5] hover:bg-[#f4e0a5]/10 transition">
                    Clear Gallery
                </button>
            </div>
            <div id="saved-gallery" class="grid grid-cols-4 gap-2"></div>
        </div>
    </footer>

    <div id="preview-modal" class="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 hidden">
        <div class="glass-panel p-4 rounded-3xl max-w-sm w-full flex flex-col items-center gap-4">
            <h3 class="text-xs tracking-widest text-[#f4e0a5] uppercase">Photo Captured</h3>
            <div class="w-full aspect-[3/4] rounded-2xl overflow-hidden border border-[#f4e0a5]/20 bg-black">
                <img id="modal-image" class="w-full h-full object-cover" src="" alt="Captured Image">
            </div>
            
            <button id="download-photo-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-[#f4e0a5]/20 to-[#f4e0a5]/5 border border-[#f4e0a5]/40 text-xs font-medium tracking-widest text-[#f4e0a5] uppercase hover:brightness-110 transition flex items-center justify-center gap-2 shadow-lg">
                <i data-lucide="download" class="w-4 h-4"></i> Save to Device Gallery
            </button>
            
            <button id="close-modal-btn" class="w-full py-2 rounded-xl bg-white/5 border border-white/10 text-xs tracking-wider uppercase text-slate-400 hover:text-white transition">
                Return to Camera
            </button>
        </div>
    </div>

    <canvas id="render-canvas" class="hidden"></canvas>

    <script>
        // Core Characters Array Configuration
        const pokemonList = [
            { id: 'arceus', name: 'Arceus', tint: 'sepia(0.12) saturate(1.15) brightness(1.02)', glow: '#f4e0a5', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/493.svg' },
            { id: 'pikachu', name: 'Pikachu', tint: 'sepia(0.08) saturate(1.25) brightness(1.02)', glow: '#facc15', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/25.svg' },
            { id: 'charizard', name: 'Charizard', tint: 'saturate(1.15) hue-rotate(-8deg) brightness(1.02)', glow: '#f97316', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/6.svg' },
            { id: 'mewtwo', name: 'Mewtwo', tint: 'hue-rotate(240deg) saturate(0.9) brightness(1.03)', glow: '#c084fc', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/150.svg' },
            { id: 'gengar', name: 'Gengar', tint: 'hue-rotate(220deg) contrast(1.05) brightness(1.02)', glow: '#a855f7', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/94.svg' },
            { id: 'lugia', name: 'Lugia', tint: 'hue-rotate(160deg) saturate(0.85) brightness(1.02)', glow: '#38bdf8', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/249.svg' },
            { id: 'rayquaza', name: 'Rayquaza', tint: 'hue-rotate(80deg) saturate(1.1) brightness(1.02)', glow: '#22c55e', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/384.svg' },
            { id: 'bulbasaur', name: 'Bulbasaur', tint: 'hue-rotate(90deg) saturate(1.1) brightness(1.02)', glow: '#2dd4bf', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/1.svg' },
            { id: 'lucario', name: 'Lucario', tint: 'hue-rotate(170deg) contrast(1.02)', glow: '#60a5fa', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/448.svg' },
            { id: 'gardevoir', name: 'Gardevoir', tint: 'hue-rotate(110deg) saturate(0.85)', glow: '#4ade80', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/282.svg' },
            { id: 'eevee', name: 'Eevee', tint: 'sepia(0.15) saturate(1.1)', glow: '#fb923c', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/133.svg' },
            { id: 'mew', name: 'Mew', tint: 'hue-rotate(300deg) saturate(1.15)', glow: '#f472b6', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/151.svg' },
            { id: 'greninja', name: 'Greninja', tint: 'hue-rotate(190deg) contrast(1.1)', glow: '#1d4ed8', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/658.svg' },
            { id: 'blastoise', name: 'Blastoise', tint: 'hue-rotate(180deg) saturate(1.05)', glow: '#2563eb', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/9.svg' },
            { id: 'snorlax', name: 'Snorlax', tint: 'hue-rotate(140deg) saturate(0.7) brightness(0.98)', glow: '#0f766e', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/143.svg' }
        ];

        // NEW: 10 Cute Pokémon Items & Objects
        const itemList = [
            { id: 'pokeball', name: 'Poké Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png' },
            { id: 'greatball', name: 'Great Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/great-ball.png' },
            { id: 'ultraball', name: 'Ultra Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ultra-ball.png' },
            { id: 'masterball', name: 'Master Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png' },
            { id: 'luxuryball', name: 'Luxury Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png' },
            { id: 'leftovers', name: 'Leftovers', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/leftovers.png' },
            { id: 'soothe-bell', name: 'Soothe Bell', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/soothe-bell.png' },
            { id: 'light-ball', name: 'Light Ball', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/light-ball.png' },
            { id: 'sweet-heart', name: 'Sweet Heart', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/sweet-heart.png' },
            { id: 'amulet-coin', name: 'Amulet Coin', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/amulet-coin.png' }
        ];

        lucide.createIcons();

        const video = document.getElementById('camera-stream');
        const cameraContainer = document.getElementById('camera-container');
        const errorState = document.getElementById('error-state');
        const activeOverlay = document.getElementById('active-overlay');
        const itemOverlay = document.getElementById('item-overlay');
        const selectorContainer = document.getElementById('pokemon-selector');
        const itemSelectorContainer = document.getElementById('item-selector');
        const captureBtn = document.getElementById('capture-btn');
        const flipBtn = document.getElementById('flip-btn');
        const clearBtn = document.getElementById('clear-frame-btn');
        const renderCanvas = document.getElementById('render-canvas');
        const statusOrb = document.getElementById('status-orb');

        const previewModal = document.getElementById('preview-modal');
        const modalImage = document.getElementById('modal-image');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const downloadPhotoBtn = document.getElementById('download-photo-btn');
        const galleryCount = document.getElementById('gallery-count');
        const savedGallery = document.getElementById('saved-gallery');
        const clearGalleryBtn = document.getElementById('clear-gallery-btn');
        const STORAGE_KEY = 'pokemon-camera-saved-gallery';
        const MAX_SAVED_PHOTOS = 16;
        let savedPhotos = [];

        let currentStream = null;
        let currentFacingMode = "user"; 

        // Build Carousels
        function buildSelectors() {
            // Characters
            pokemonList.forEach(poke => {
                const item = document.createElement('div');
                item.className = "flex-shrink-0 w-14 h-14 rounded-xl glass-panel flex items-center justify-center p-2 cursor-pointer transition hover:border-[#f4e0a5]/60 active:scale-95";
                item.innerHTML = `<img src="${poke.url}" class="w-full h-full object-contain opacity-60 hover:opacity-100 transition" alt="${poke.name}">`;
                item.addEventListener('click', () => {
                    activeOverlay.src = poke.url;
                    activeOverlay.style.opacity = "0.85"; 
                    activeOverlay.style.setProperty('--poke-glow', poke.glow);
                    
                    video.style.filter = poke.tint;
                    statusOrb.style.backgroundColor = poke.glow;
                    cameraContainer.style.boxShadow = `0 0 30px ${poke.glow}25, inset 0 0 20px ${poke.glow}10`;
                });
                selectorContainer.appendChild(item);
            });

            // Decorations/Items
            itemList.forEach(obj => {
                const item = document.createElement('div');
                item.className = "flex-shrink-0 w-12 h-12 rounded-xl glass-panel flex items-center justify-center p-1 cursor-pointer transition hover:border-white/40 active:scale-95";
                item.innerHTML = `<img src="${obj.url}" class="w-10 h-10 object-contain pixelated" alt="${obj.name}">`;
                item.addEventListener('click', () => {
                    itemOverlay.src = obj.url;
                    itemOverlay.style.opacity = "0.9";
                });
                itemSelectorContainer.appendChild(item);
            });
        }

        // Adaptive Laptop/Mobile Constraint Camera Switcher Engine
        async function startCamera() {
            if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
            video.style.transform = (currentFacingMode === "user") ? "scaleX(-1)" : "scaleX(1)";

            const constraints = {
                audio: false,
                video: {
                    facingMode: currentFacingMode,
                    // FIX: Uses width/height ranges instead of fixed numbers so laptop screens don't crash
                    width: { min: 640, ideal: 1080, max: 1920 },
                    height: { min: 480, ideal: 1440, max: 1080 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                errorState.classList.add('hidden');
                video.classList.remove('hidden');
            } catch (err) {
                console.warn("Retrying with simplified camera fallback structure...");
                try {
                    // Laptop Widescreen Safe Fallback
                    constraints.video.height = { ideal: 1080 };
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = currentStream;
                    errorState.classList.add('hidden');
                    video.classList.remove('hidden');
                } catch(fallbackErr) {
                    video.classList.add('hidden');
                    errorState.classList.remove('hidden');
                }
            }
        }

        flipBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera();
        });

        clearBtn.addEventListener('click', () => {
            activeOverlay.src = ""; activeOverlay.style.opacity = "0";
            itemOverlay.src = ""; itemOverlay.style.opacity = "0";
            video.style.filter = "none";
            statusOrb.style.backgroundColor = "#f4e0a5";
            cameraContainer.style.boxShadow = "0 0 30px rgba(244, 224, 165, 0.1), inset 0 0 20px rgba(244, 224, 165, 0.05)";
        });

        // Photo Assembly Canvas Logic
        captureBtn.addEventListener('click', () => {
            document.body.style.backgroundColor = '#ffffff';
            setTimeout(() => { document.body.style.background = 'radial-gradient(circle at center, #12122c 0%, #05050f 100%)'; }, 100);

            const width = video.videoWidth;
            const height = video.videoHeight;
            renderCanvas.width = width;
            renderCanvas.height = height;

            const ctx = renderCanvas.getContext('2d');
            
            // Core Base Composition Image Filter Chain
            let activeFilters = "contrast(1.05) saturate(1.1) brightness(1.02) blur(0.4px)"; // Skin Smoothing Soft Filter
            const currentSelected = pokemonList.find(p => activeOverlay.src.includes(p.url));
            if(currentSelected) {
                activeFilters += " " + currentSelected.tint;
            }
            ctx.filter = activeFilters;

            ctx.save();
            if(currentFacingMode === "user") {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, width, height);
            ctx.restore();
            ctx.filter = "none"; 

            // Text Rendering Setup
            ctx.font = "bold " + (width * 0.038) + "px system-ui, -apple-system, sans-serif";
            ctx.fillStyle = "#f4e0a5";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
            ctx.shadowBlur = 10;
            ctx.fillText("❤️ ARRA HEART MARK ❤️", width / 2, height * 0.08);
            ctx.shadowBlur = 0;

            // Load and draw layers safely using a unified promise sequence to prevent missing cuts
            const drawLayers = [];

            if (itemOverlay.src && itemOverlay.style.opacity !== "0") {
                drawLayers.push(new Promise(res => {
                    const img = new Image(); img.crossOrigin = "anonymous"; img.src = itemOverlay.src;
                    img.onload = () => {
                        const size = width * 0.22;
                        ctx.drawImage(img, width * 0.05, height - size - (height * 0.05), size, size);
                        res();
                    };
                }));
            }

            if (activeOverlay.src && activeOverlay.style.opacity !== "0") {
                drawLayers.push(new Promise(res => {
                    const img = new Image(); img.crossOrigin = "anonymous"; img.src = activeOverlay.src;
                    img.onload = () => {
                        const size = width * 0.35;
                        const x = width - size - (width * 0.05);
                        const y = height - size - (height * 0.05);
                        ctx.drawImage(img, x, y, size, size);
                        res();
                    };
                }));
            }

            Promise.all(drawLayers).then(() => {
                const dataUrl = renderCanvas.toDataURL('image/jpeg', 0.95);
                addSavedPhoto(dataUrl, true);
                modalImage.src = dataUrl;
                previewModal.classList.remove('hidden');
            });
        });

        function loadSavedGallery() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return;
                savedPhotos = JSON.parse(stored) || [];
                savedPhotos.slice().reverse().forEach(photo => addSavedPhoto(photo, false));
            } catch (err) {
                console.warn('Could not load saved gallery', err);
                savedPhotos = [];
            }
        }

        function persistGallery() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPhotos));
            } catch (err) {
                console.warn('Could not persist saved gallery', err);
            }
        }

        function updateGalleryCount() {
            galleryCount.textContent = `${savedGallery.children.length} photos`;
            clearGalleryBtn.disabled = savedGallery.children.length === 0;
            clearGalleryBtn.classList.toggle('opacity-50', savedGallery.children.length === 0);
        }

        function addSavedPhoto(dataUrl, save = true) {
            const photoButton = document.createElement('button');
            photoButton.type = 'button';
            photoButton.className = 'w-full aspect-square rounded-2xl overflow-hidden border border-white/10 bg-slate-950/70';
            photoButton.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover" alt="Saved snapshot">`;
            photoButton.addEventListener('click', () => {
                modalImage.src = dataUrl;
                previewModal.classList.remove('hidden');
            });

            savedGallery.prepend(photoButton);
            if (save) {
                savedPhotos.unshift(dataUrl);
                if (savedPhotos.length > MAX_SAVED_PHOTOS) savedPhotos.pop();
                persistGallery();
            }
            updateGalleryCount();
        }

        function clearSavedGallery() {
            savedPhotos = [];
            savedGallery.innerHTML = '';
            persistGallery();
            updateGalleryCount();
        }

        // Force Blob download channel for rock-solid mobile device saving
        downloadPhotoBtn.addEventListener('click', () => {
            renderCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `arra_snapshot_${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.95);
        });

        closeModalBtn.addEventListener('click', () => {
            previewModal.classList.add('hidden');
            modalImage.src = "";
        });

        clearGalleryBtn.addEventListener('click', () => {
            clearSavedGallery();
        });

        window.addEventListener('DOMContentLoaded', () => {
            buildSelectors();
            startCamera();
            loadSavedGallery();
        });
    </script>
</body>
</html>
